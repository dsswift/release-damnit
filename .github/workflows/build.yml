name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach binaries to
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach binaries to (e.g. v1.4.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build every platform
        env:
          TAG: ${{ inputs.tag }}
        run: make build-all VERSION="${TAG#v}"
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" build/* --clobber
