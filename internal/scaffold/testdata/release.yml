name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The branch tip, not the pushed commit: a run queued behind another
      # release must see that release's version commit and tags.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      # Verify first: the commit being released must carry the landing
      # proof release-damnit land signed after the check passed. The
      # estate's allowed signers are the repository or organization
      # variable RELEASE_DAMNIT_ALLOWED_SIGNERS.
      - id: release
        uses: dsswift/release-damnit@{{release}}
        with:
          verify: 'true'
          allowed-signers: ${{ vars.RELEASE_DAMNIT_ALLOWED_SIGNERS }}
          since-last-release: 'true'
          publish: 'true'

  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
